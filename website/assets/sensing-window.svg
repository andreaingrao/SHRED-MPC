<path d="M640 442H739" class="line"/>
<text x="690" y="413" class="muted" text-anchor="middle">[Xₜ | Ωⱼ]</text>
<text x="755" y="217" class="step">2 / SHRED SURROGATE</text>
<rect x="750" y="300" width="320" height="290" rx="20" fill="#185e79"/>
<text x="910" y="345" class="heading white" text-anchor="middle">Trained model</text>
<rect x="778" y="371" width="264" height="65" rx="10" fill="#fff"/>
<text x="910" y="398" class="body" text-anchor="middle">Recurrent encoder</text>
<text x="910" y="422" class="muted" text-anchor="middle">LSTM · temporal history</text>
<path d="M910 443V463" stroke="#fff" stroke-width="2.5"/>
<path d="M904 457L910 464L916 457" fill="none" stroke="#fff" stroke-width="2.5"/>
<rect x="778" y="472" width="264" height="87" rx="10" fill="#fff"/>
<text x="910" y="502" class="body" text-anchor="middle">Shallow decoder</text>
<text x="910" y="529" class="muted" text-anchor="middle">+ spatial reconstruction</text>
<text x="910" y="643" class="body" text-anchor="middle">Same weights for</text>
<text x="910" y="673" class="body" text-anchor="middle">every candidate rotation</text>
<path d="M1070 442H1160" class="line"/>
<text x="1115" y="413" class="muted" text-anchor="middle">predict</text>
<rect x="1170" y="178" width="570" height="524" rx="19" fill="#f7fafb" stroke="#c8d7dd" stroke-width="2"/>
