<text x="543" y="571" class="math" text-anchor="middle" style="fill:#99521e">ωⱼ</text>
<text x="88" y="633" class="body" >Xₜ: L samples × m pressure sensors</text>
<text x="88" y="670" class="body" style="fill:#99521e">Ωⱼ: one added rotation channel</text>
