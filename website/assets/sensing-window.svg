<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
<title id="title">Parameter-conditioned SHRED: one sensing window, different candidate futures</title>
<desc id="desc">A full lag of L sparse-pressure measurement vectors is combined with an additional rotation-parameter channel. A single trained SHRED surrogate, consisting of a recurrent encoder and a shallow decoder with spatial reconstruction, predicts a future window of pressure fields at all mesh locations. Keeping the measured history and weights fixed while changing the rotation parameter produces different predicted fields on the same mesh. A constant parameter is shown to simplify this conceptual example; the implementation uses ramp-and-hold profiles and its configured observation-prediction offset.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L11 6L1 11Z" fill="#23677d"/></marker>
  <style>
    text { font-family:"Segoe UI",Arial,sans-serif; fill:#193744; }
    .title { font-size:39px; font-weight:600; letter-spacing:-.6px; }
    .subtitle { font-size:22px; fill:#526a74; }
    .step { font-size:16px; font-weight:700; letter-spacing:1.4px; fill:#245d71; }
    .heading { font-size:25px; font-weight:600; }
    .body { font-size:20px; }
    .muted { font-size:18px; fill:#526a74; }
    .math { font-family:"DejaVu Sans","Segoe UI",sans-serif; font-size:25px; }
    .white { fill:#fff; }
    .smallwhite { font-size:20px; fill:#e3f0f4; }
    .line { fill:none; stroke:#23677d; stroke-width:3; stroke-linejoin:round; marker-end:url(#arrow); }
  </style>
</defs>
<rect width="1800" height="1000" fill="#fff"/>
<text x="60" y="70" class="title">Parameter-conditioned SHRED prediction</text>
<text x="60" y="112" class="subtitle">One complete sensing window + a candidate rotation → a future pressure field</text>
<!-- One input example; no progressive versions of the architecture. -->
<rect x="60" y="178" width="580" height="524" rx="19" fill="#f7fafb" stroke="#c8d7dd" stroke-width="2"/>
<text x="88" y="217" class="step">1 / ASSEMBLE THE INPUT</text>
<text x="88" y="259" class="heading">L timesteps of sparse measurements</text>

<text x="153" y="303" class="muted" text-anchor="middle">t−L+1</text>
<rect x="104" y="320" width="98" height="151" rx="9" fill="#e4f0f4" stroke="#9ebbc7"/>
<text x="153" y="351" class="math" text-anchor="middle">x₁</text>
<text x="153" y="386" class="math" text-anchor="middle">x₂</text>
<text x="153" y="420" class="math" text-anchor="middle">⋮</text>
<text x="153" y="455" class="math" text-anchor="middle">xₘ</text>
<text x="283" y="303" class="muted" text-anchor="middle">t−L+2</text>
<rect x="234" y="320" width="98" height="151" rx="9" fill="#e4f0f4" stroke="#9ebbc7"/>
<text x="283" y="351" class="math" text-anchor="middle">x₁</text>
<text x="283" y="386" class="math" text-anchor="middle">x₂</text>
<text x="283" y="420" class="math" text-anchor="middle">⋮</text>
<text x="283" y="455" class="math" text-anchor="middle">xₘ</text>
<text x="413" y="303" class="muted" text-anchor="middle">⋯</text>
<rect x="364" y="320" width="98" height="151" rx="9" fill="#e4f0f4" stroke="#9ebbc7"/>
<text x="413" y="405" class="math" text-anchor="middle">⋯</text>
<text x="543" y="303" class="muted" text-anchor="middle">t</text>
<rect x="494" y="320" width="98" height="151" rx="9" fill="#e4f0f4" stroke="#9ebbc7"/>
<text x="543" y="351" class="math" text-anchor="middle">x₁</text>
<text x="543" y="386" class="math" text-anchor="middle">x₂</text>
<text x="543" y="420" class="math" text-anchor="middle">⋮</text>
<text x="543" y="455" class="math" text-anchor="middle">xₘ</text>
<rect x="104" y="533" width="98" height="57" rx="9" fill="#fff2e6" stroke="#bd7e4b"/>
<text x="153" y="571" class="math" text-anchor="middle" style="fill:#99521e">ωⱼ</text>
<rect x="234" y="533" width="98" height="57" rx="9" fill="#fff2e6" stroke="#bd7e4b"/>
<text x="283" y="571" class="math" text-anchor="middle" style="fill:#99521e">ωⱼ</text>
<rect x="364" y="533" width="98" height="57" rx="9" fill="#fff2e6" stroke="#bd7e4b"/>
<text x="413" y="571" class="math" text-anchor="middle" style="fill:#99521e">⋯</text>
