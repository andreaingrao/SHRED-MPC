<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">SHRED surrogate inside the model predictive control loop</title>
  <desc id="desc">Sparse pressure observations and applied cylinder rotation history enter a SHRED pressure surrogate. SHRED predicts pressure for candidate future rotations. A pressure-lift observable and MPC optimizer evaluate those candidates against a lift target. The selected first rotation segment advances the OpenFOAM CFD plant. New sparse measurements update the history and the process repeats.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L10 5.5 L1 10 Z" fill="#22677f"/></marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L10 5.5 L1 10 Z" fill="#ad5c24"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill:#193744; }
      .title { font-size:37px; font-weight:650; letter-spacing:-.5px; }
      .subtitle { font-size:19px; fill:#526a74; }
      .on-dark { fill:#fff; }
      .section { font-size:14px; font-weight:700; letter-spacing:1.5px; fill:#2b6679; }
      .box-title { font-size:23px; font-weight:650; }
      .box-subtitle { font-size:16px; fill:#526a74; }
      .body { font-size:17px; }
      .small { font-size:15px; fill:#526a74; }
      .signal { font-size:14px; font-weight:600; fill:#285b70; }
      .card { fill:#fff; stroke:#9fb4bc; stroke-width:2; }
      .line { fill:none; stroke:#22677f; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .candidate { fill:none; stroke:#ad5c24; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowOrange); }
      .applied { fill:none; stroke:#ad5c24; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowOrange); }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <text x="72" y="66" class="title">SHRED surrogate inside the MPC loop</text>
  <text x="74" y="105" class="subtitle">Candidate rotations are screened with learned pressure predictions; CFD advances with the selected move.</text>

  <!-- MPC boundary -->
  <rect x="350" y="160" width="1190" height="535" rx="24" fill="#f7fafb" stroke="#6d8994" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="386" y="139" width="532" height="42" rx="21" fill="#fff" stroke="#6d8994" stroke-width="2"/>
  <text x="412" y="166" class="section">MODEL PREDICTIVE CONTROLLER · REPEATS AT EACH UPDATE</text>

  <!-- History input -->
  <rect x="52" y="326" width="250" height="214" rx="18" class="card"/>
  <text x="78" y="365" class="section">AVAILABLE HISTORY</text>
  <line x1="78" y1="384" x2="276" y2="384" stroke="#d9e3e6" stroke-width="2"/>
  <circle cx="89" cy="421" r="6" fill="#22677f"/>
  <text x="108" y="427" class="body">Sparse pressure</text>
  <text x="108" y="451" class="small">pₛ(t−L : t)</text>
  <circle cx="89" cy="484" r="6" fill="#ad5c24"/>
  <text x="108" y="490" class="body">Applied rotation</text>
  <text x="108" y="514" class="small">ω(t−L : t)</text>

  <!-- Input history enters surrogate -->
  <path d="M302 425 H424" class="line"/>
  <text x="305" y="396" class="signal">measured history</text>

  <!-- SHRED surrogate -->
  <rect x="425" y="300" width="275" height="255" rx="20" fill="#e8f2f5" stroke="#22677f" stroke-width="3"/>
  <path d="M445 300 H680 Q700 300 700 320 V351 H425 V320 Q425 300 445 300 Z" fill="#185e79"/>
  <text x="458" y="336" class="on-dark" font-size="23" font-weight="700">SHRED SURROGATE</text>
  <text x="453" y="387" class="box-subtitle">Control-conditioned predictor</text>
  <rect x="453" y="410" width="94" height="52" rx="10" fill="#fff" stroke="#9fb4bc" stroke-width="1.5"/>
  <text x="500" y="443" text-anchor="middle" class="body" font-weight="600">LSTM</text>
  <path d="M552 436 H575" class="line" stroke-width="2.2"/>
  <rect x="580" y="410" width="92" height="52" rx="10" fill="#fff" stroke="#9fb4bc" stroke-width="1.5"/>
  <text x="626" y="432" text-anchor="middle" class="small">Pressure</text>
  <text x="626" y="451" text-anchor="middle" class="small">decoder</text>
  <text x="453" y="493" class="small">Input: history + candidate ω</text>
  <text x="453" y="522" class="small">Output: future pressure field p̂</text>

  <!-- Predicted pressure to observable -->
  <path d="M700 424 H787" class="line"/>

  <!-- Pressure lift observable -->
  <rect x="790" y="337" width="260" height="178" rx="18" class="card"/>
  <text x="818" y="378" class="section">LIFT OBSERVABLE</text>
  <text x="818" y="414" class="box-title">Pressure → lift</text>
  <text x="818" y="447" class="body">Lₚ from predicted</text>
  <text x="818" y="473" class="body">cylinder-surface pressure</text>
  <text x="818" y="498" class="small">A pressure proxy, not total lift</text>

  <!-- Observable to optimizer -->
  <path d="M1050 426 H1129" class="line"/>

  <!-- Optimizer -->
  <rect x="1132" y="290" width="345" height="275" rx="20" fill="#fff" stroke="#22677f" stroke-width="3"/>
  <path d="M1152 290 H1457 Q1477 290 1477 310 V347 H1132 V310 Q1132 290 1152 290 Z" fill="#185e79"/>
  <text x="1163" y="327" class="on-dark" font-size="22" font-weight="700">MPC OPTIMIZER</text>
  <rect x="1163" y="366" width="278" height="38" rx="19" fill="#e8f2f5"/>
  <text x="1181" y="391" class="body" font-weight="600">Target pressure-lift L*</text>
  <text x="1163" y="437" class="body">Score each candidate by:</text>
  <text x="1180" y="466" class="small">• lift tracking</text>
  <text x="1180" y="490" class="small">• predicted lift oscillation</text>
  <text x="1180" y="514" class="small">• size of the control move</text>
  <text x="1163" y="545" class="signal">Select the lowest-cost profile</text>

  <!-- Candidate iteration loop -->
  <path d="M1305 565 V619 H562 V555" class="candidate"/>
  <rect x="746" y="597" width="382" height="38" rx="19" fill="#fff6ed" stroke="#d9a67c" stroke-width="1.5"/>
  <text x="937" y="622" text-anchor="middle" font-size="15" font-weight="600" fill="#8f4b1d">Propose candidate rotation profiles · evaluate · repeat</text>

  <!-- Selected command to physical CFD -->
  <path d="M1477 426 H1550 V852 H1117" class="applied"/>
  <rect x="1320" y="691" width="208" height="64" rx="12" fill="#fff6ed" stroke="#d9a67c" stroke-width="1.5"/>
  <text x="1424" y="718" text-anchor="middle" class="small" fill="#8f4b1d">Apply first segment</text>
  <text x="1424" y="740" text-anchor="middle" class="small" fill="#8f4b1d">of selected ω profile</text>

  <!-- CFD plant -->
  <rect x="600" y="790" width="520" height="150" rx="22" fill="#eaf1f3" stroke="#244b5b" stroke-width="3"/>
  <rect x="600" y="790" width="12" height="150" rx="6" fill="#185e79"/>
  <text x="646" y="836" class="section">PHYSICAL PLANT</text>
  <text x="646" y="872" class="box-title">OpenFOAM CFD</text>
  <text x="646" y="905" class="box-subtitle">Advance the flow and return new sparse pressure data</text>

  <!-- Measurements update the observation and control history -->
  <path d="M600 866 H169 V540" class="line"/>
  <rect x="218" y="839" width="324" height="38" rx="19" fill="#fff" stroke="#9fb4bc" stroke-width="1.5"/>
  <text x="380" y="864" text-anchor="middle" class="small">New measurements update the history</text>

  <text x="72" y="978" class="small">At each MPC update: predict many candidate futures with SHRED, apply one control segment in CFD, then replan.</text>
</svg>
