[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shred-mpc-research"
version = "0.1.0"
description = "Control-conditioned SHRED pressure prediction and MPC research tools"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4"]

[project.optional-dependencies]
demo = ["matplotlib==3.10.8"]
research = ["pyshred==1.0.21", "torch==2.9.1", "pandas==2.3.3", "scikit-learn==1.8.0", "matplotlib==3.10.8", "scipy==1.16.3"]

[project.scripts]
shred-temporal = "shred_mpc.cli.temporal:main"
shred-control-table = "shred_mpc.cli.control_table:main"
shred-dataset = "shred_mpc.cli.dataset:main"
shred-mpc-historical = "shred_mpc.cli.historical:main"

[tool.setuptools.packages.find]
where = ["src"]
